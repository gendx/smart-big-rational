[package]
name = "smart-big-rational"
description = "Efficient rational numbers for additions, subtractions and multiplications"
version = "0.3.2"
authors = ["Guillaume Endignoux <guillaumee@google.com>"]
license = "Apache-2.0"
repository = "https://github.com/gendx/smart-big-rational"
categories = ["algorithms", "data-structures", "mathematics", "science"]
keywords = ["arithmetic", "exact", "fractions", "numerics", "rational"]
exclude = [".github/*"]
edition = "2024"
rust-version = "1.91.0"

[package.metadata.docs.rs]
features = ["serde"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = []
serde = ["dep:serde", "num-bigint/serde", "smallvec/serde"]

[dependencies]
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-rational = { version = "0.4.2", default-features = false, features = ["std"] }
num-traits = "0.2.19"
serde = { optional = true, version = "1.0.229", features = ["derive"] }
smallvec = { version = "1.16.5", features = ["const_new", "union"] }

[dev-dependencies]
rand = "0.10.4"
postcard = { version = "1.1.3", features = ["use-std"] }
serde_json = "1.0.154"
